<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="scShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#scGradient)" filter="url(#scShadow)" />

  <!-- "中" stylized character -->
  <!-- Outer box of 中 -->
  <rect x="18" y="21" width="28" height="21" rx="4" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center vertical stroke penetrating through -->
  <line x1="32" y1="13" x2="32" y2="50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
</svg>