<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>しゃべチャイナ アイコン候補</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:40px;background:#f5f2ed;color:#292524;font-family:"Noto Sans JP",sans-serif}h1{margin:0 0 28px;font-size:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:white;border:1px solid #e7e5e4;border-radius:22px;padding:22px;box-shadow:0 8px 24px #78350f10}.top{display:flex;align-items:center;gap:18px}.hero{width:128px;height:128px}.sizes{display:flex;align-items:end;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #eee}.sizes img:nth-child(1){width:48px;height:48px}.sizes img:nth-child(2){width:32px;height:32px}.sizes img:nth-child(3){width:16px;height:16px}h2{font-size:17px;margin:0 0 5px}.num{color:#e11d48;font-weight:800;font-size:13px}.hint{font-size:12px;color:#78716c;margin:0}
</style>
<h1>しゃべチャイナ — アイコン／ファビコン候補</h1>
<main class="grid">
  <article class="card"><div class="top"><img class="hero" src="01-twin-chat-heart.svg"><div><div class="num">01</div><h2>ふたつの吹き出し</h2><p class="hint">会話と友情</p></div></div><div class="sizes"><img src="01-twin-chat-heart.svg"><img src="01-twin-chat-heart.svg"><img src="01-twin-chat-heart.svg"></div></article>
  <article class="card"><div class="top"><img class="hero" src="02-chatty-panda.svg"><div><div class="num">02</div><h2>おしゃべりパンダ</h2><p class="hint">中国語と親しみ</p></div></div><div class="sizes"><img src="02-chatty-panda.svg"><img src="02-chatty-panda.svg"><img src="02-chatty-panda.svg"></div></article>
  <article class="card"><div class="top"><img class="hero" src="03-tone-smile.svg"><div><div class="num">03</div><h2>声調スマイル</h2><p class="hint">発音と楽しさ</p></div></div><div class="sizes"><img src="03-tone-smile.svg"><img src="03-tone-smile.svg"><img src="03-tone-smile.svg"></div></article>
  <article class="card"><div class="top"><img class="hero" src="04-chat-ribbon.svg"><div><div class="num">04</div><h2>チャットリボン</h2><p class="hint">言葉のつながり</p></div></div><div class="sizes"><img src="04-chat-ribbon.svg"><img src="04-chat-ribbon.svg"><img src="04-chat-ribbon.svg"></div></article>
  <article class="card"><div class="top"><img class="hero" src="05-hello-face.svg"><div><div class="num">05</div><h2>你好フェイス</h2><p class="hint">気さくな話し相手</p></div></div><div class="sizes"><img src="05-hello-face.svg"><img src="05-hello-face.svg"><img src="05-hello-face.svg"></div></article>
  <article class="card"><div class="top"><img class="hero" src="06-seal-chat.svg"><div><div class="num">06</div><h2>朱印風チャット</h2><p class="hint">中国らしさと会話</p></div></div><div class="sizes"><img src="06-seal-chat.svg"><img src="06-seal-chat.svg"><img src="06-seal-chat.svg"></div></article>
</main>
</html>
